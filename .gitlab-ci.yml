stages: [build, test, doc, publish]

include:
  - project: devops/ci
    file: conan.yml

variables:
  CONAN_BUILD_TYPE: Release
  CONAN_ARGS: -o &:shared=True -o &:test=False

build:cpp:x86_64:
  extends: .build:cpp:x86_64

build:cpp:windows:
  extends: .build:cpp:windows
  variables:
    CONAN_ARGS: -o &:shared=True -o &:test=True -o &:with_qt=False -o &:with_glaze=True

test:cpp:x86_64:
  extends: .test:cpp:x86_64
  parallel:
    matrix:
      - WLIB_WITH_QT: ["False", "True"]
        WLIB_WITH_GLAZE: ["False", "True"]
  script:
    - >
      conan build "$CONAN_RECIPE" "${conan_profile[@]}"
      --build=missing
      -o "&:shared=True"
      -o "&:test=True"
      -o "&:with_qt=$WLIB_WITH_QT"
      -o "&:with_glaze=$WLIB_WITH_GLAZE"
    - |
      mapfile -t WLIB_LIBRARIES < <(find "$CONAN_BUILD_DIR" -type f -name 'libwlib.so*')
      test "${#WLIB_LIBRARIES[@]}" -gt 0
      WLIB_LINKAGE="$(ldd "${WLIB_LIBRARIES[0]}")"
      if [[ "$WLIB_WITH_QT" == "True" ]]; then
        grep -Fq "libQt6Core" <<< "$WLIB_LINKAGE"
        grep -Fq "libQt6Gui" <<< "$WLIB_LINKAGE"
        grep -Fq "libQt6Network" <<< "$WLIB_LINKAGE"
      else
        ! grep -Fq "libQt6Core" <<< "$WLIB_LINKAGE"
        ! grep -Fq "libQt6Gui" <<< "$WLIB_LINKAGE"
        ! grep -Fq "libQt6Network" <<< "$WLIB_LINKAGE"
      fi
    - bash ci/cmake-package.sh "$CONAN_BUILD_DIR"
    - ctest --test-dir "$CONAN_BUILD_DIR" --output-on-failure -j "${RUNNER_BUILD_JOBS:-2}" --output-junit "$CI_PROJECT_DIR/ctest.xml"

publish:conan:x86_64:
  extends: .publish:conan:x86_64

publish:conan:windows:
  extends: .publish:conan:windows
