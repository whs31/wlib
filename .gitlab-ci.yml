stages: [build, test, doc, publish]

include:
  - project: devops/ci
    file: conan.yml

variables:
  CONAN_BUILD_TYPE: Release
  CONAN_ARGS: -o &:shared=True -o &:test=False

build:cpp:x86_64:
  extends: .build:cpp:x86_64

build:cpp:windows:
  extends: .build:cpp:windows
  variables:
    CONAN_ARGS: -o &:shared=True -o &:test=True -o &:with_qt=False -o &:with_nlohmann=True

test:cpp:x86_64:
  extends: .test:cpp:x86_64
  parallel:
    matrix:
      - WCOMMON_WITH_QT: ["False", "True"]
        WCOMMON_WITH_ADAPTERS: ["False", "True"]
        WCOMMON_NAMESPACE: ["whs31"]
      # Any other namespace builds a respelled copy of the sources.
      - WCOMMON_WITH_QT: ["True"]
        WCOMMON_WITH_ADAPTERS: ["True"]
        WCOMMON_NAMESPACE: ["acme::util"]
  script:
    - >
      conan build "$CONAN_RECIPE" "${conan_profile[@]}"
      --build=missing
      -o "&:shared=True"
      -o "&:test=True"
      -o "&:with_qt=$WCOMMON_WITH_QT"
      -o "&:with_nlohmann=$WCOMMON_WITH_ADAPTERS"
      -o "&:with_glaze=$WCOMMON_WITH_ADAPTERS"
      -o "&:namespace=$WCOMMON_NAMESPACE"
    - |
      mapfile -t WCOMMON_LIBRARIES < <(find "$CONAN_BUILD_DIR" -type f -name 'libwcommon.so*')
      test "${#WCOMMON_LIBRARIES[@]}" -gt 0
      WCOMMON_LINKAGE="$(ldd "${WCOMMON_LIBRARIES[0]}")"
      if [[ "$WCOMMON_WITH_QT" == "True" ]]; then
        grep -Fq "libQt6Core" <<< "$WCOMMON_LINKAGE"
        grep -Fq "libQt6Gui" <<< "$WCOMMON_LINKAGE"
        grep -Fq "libQt6Network" <<< "$WCOMMON_LINKAGE"
      else
        ! grep -Fq "libQt6Core" <<< "$WCOMMON_LINKAGE"
        ! grep -Fq "libQt6Gui" <<< "$WCOMMON_LINKAGE"
        ! grep -Fq "libQt6Network" <<< "$WCOMMON_LINKAGE"
      fi
    - bash ci/cmake-package.sh "$CONAN_BUILD_DIR"
    - ctest --test-dir "$CONAN_BUILD_DIR" --output-on-failure -j "${RUNNER_BUILD_JOBS:-2}" --output-junit "$CI_PROJECT_DIR/ctest.xml"

# a tag publishes the recipe version it names, nothing else: `6.0.0` for version = "6.0.0"
publish:conan:x86_64:
  extends: .publish:conan:x86_64

publish:conan:windows:
  extends: .publish:conan:windows
