stages: [build, test, doc, publish]

include:
  - project: devops/ci
    file: conan.yml

# CONAN_LINKAGE (devops/ci) sets `&:shared`: static and shared builds are tested and published
variables:
  CONAN_BUILD_TYPE: Release
  CONAN_ARGS: -o &:test=False

build:cpp:x86_64:
  extends: .build:cpp:x86_64

build:cpp:windows:
  extends: [.build:cpp:windows, .linkage:matrix]
  variables:
    CONAN_ARGS: -o &:test=True -o &:with_glaze=True

test:cpp:x86_64:
  extends: .test:cpp:x86_64
  parallel:
    matrix:
      - WLIB_WITH_GLAZE: ["False", "True"]
        CONAN_LINKAGE: [static, shared]
  script:
    - >
      conan build "$CONAN_RECIPE" "${conan_profile[@]}"
      --build=missing
      -o "&:test=True"
      -o "&:with_glaze=$WLIB_WITH_GLAZE"
    - |
      if [ "$CONAN_LINKAGE" = shared ]; then
        mapfile -t WLIB_LIBRARIES < <(find "$CONAN_BUILD_DIR" -type f -name 'libwlib.so*')
        test "${#WLIB_LIBRARIES[@]}" -gt 0
        WLIB_LINKAGE="$(ldd "${WLIB_LIBRARIES[0]}")"
        # WLib never links Qt; the Qt integration is the separate package wlib_qt
        ! grep -Fq "libQt6" <<< "$WLIB_LINKAGE"
      else
        find "$CONAN_BUILD_DIR" -type f -name 'libwlib.a' | grep -q .
      fi
    - bash ci/cmake-package.sh "$CONAN_BUILD_DIR"
    - ctest --test-dir "$CONAN_BUILD_DIR" --output-on-failure -j "${RUNNER_BUILD_JOBS:-2}" --output-junit "$CI_PROJECT_DIR/ctest.xml"

publish:conan:x86_64:
  extends: [.publish:conan:x86_64, .linkage:matrix]

publish:conan:windows:
  extends: [.publish:conan:windows, .linkage:matrix]
